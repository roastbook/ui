name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: Roastbook/workflows/.github/actions/setup@eff204fa01a16060223d56890b847fc75dd539d0 # main
        with:
          bun-version-file: package.json

      - name: Check
        run: bun run check

      - name: Test
        run: bun test

      - name: Check package contents
        run: bun run pack
